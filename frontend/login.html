<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Log In — AuthKit</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">authkit<span>.</span></a>


    <nav>
        <a href="/register" class="nav-link">Create account</a>
    </nav>
</header>

<main class="auth-container">
    <section class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-description">
            Log in to your AuthKit account.
        </p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="message" class="form-message" role="status"></p>

            <button
                type="submit"
                class="button button-primary auth-submit"
            >
                Log in
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="/register">Create one</a>
        </p>
    </section>
</main>

<footer>
    <p>© 2026 AuthKit. Built with care.</p>
</footer>

<script src="/static/js/api.js"></script>
<script src="/static/js/login.js"></script>

</body>
</html>
