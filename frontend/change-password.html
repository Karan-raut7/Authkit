<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Change Password — AuthKit</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">authkit<span>.</span></a>

        <nav>
            <a href="dashboard.html" class="button button-secondary">
                Back to dashboard
            </a>
        </nav>
    </header>

    <main class="dashboard-container">
        <section class="dashboard-header">
            <span class="eyebrow">ACCOUNT SECURITY</span>
            <h1>Change password</h1>
            <p>Keep your account secure with a strong, unique password.</p>
        </section>

        <section class="dashboard-card">
            <form id="change-password-form">
                <div class="form-group">
                    <label for="current-password">Current password</label>

                    <input
                        type="password"
                        id="current-password"
                        name="current_password"
                        autocomplete="current-password"
                        placeholder="Enter your current password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new-password">New password</label>

                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        autocomplete="new-password"
                        placeholder="Enter your new password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Re-enter your new password"
                        minlength="8"
                        required
                    >
                </div>

                <label class="password-toggle">
                    <input type="checkbox" id="toggle-passwords">
                    Show passwords
                </label>

                <p
                    id="change-password-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="change-password-button"
                    class="button button-primary"
                >
                    Update password
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 AuthKit. Built with care.</p>
    </footer>

    <script src="/static/js/api.js"></script>
<script src="/static/js/change-password.js"></script>
</body>
</html>
